# r-doc-builder source list: a YAML list of entries, each with
#   source_type: yaml (another list like this one) | path (local file/dir: .md .mdx .txt .pdf)
#                | url (one web page) | git (repo URL, optional #subdir) | youtube (video, playlist or channel)
#                | freshdesk (help-center category or folder URL, …/support/solutions/<id>)
#                | transcripts (2-column CSV or Google Sheet: video_url, transcript — an SRT path, URL or Drive link)
#   doc_type:    label pushed with every chunk (r-doc-mcp filters on it); omit or none = inherit
#                from the yaml entry that included this file, else no doc_type at all
#   link:        relative paths resolve against this file's folder
# Uncomment and edit (an all-comment file builds nothing):
#- source_type: path
#  doc_type: docs
#  link: ./docs
#- source_type: url
#  doc_type: faq
#  link: https://example.org/help/faq
#- source_type: git
#  doc_type: docs
#  link: https://github.com/org/repo#docs
#- source_type: youtube
#  doc_type: video
#  link: https://www.youtube.com/@channel
#- source_type: freshdesk
#  doc_type: faq
#  link: https://example.freshdesk.com/support/solutions/123
#- source_type: transcripts
#  doc_type: video
#  link: ./videos.csv   # or a Google Sheet URL with the same two columns
#- source_type: yaml
#  link: other-sources.yaml
