# Ready-made rows, in the pipeline's .pkl shape ({content, metadata}), for the metadata only networked
# sources produce: Freshdesk FAQ category/folder and YouTube title/date. tests/fixture_corpus.py writes them
# to extras.pkl at test time (YAML, not a committed pickle: reviewable, and loading a pickle runs code).
# Quote dates: an unquoted YAML date loads as a date object, and a push drops non-scalar metadata.
# Sources differ from every built document, so pushing extras.pkl next to the built files is never refused.
