# r-doc-builder prompt texts for the NHLBI BioData Catalyst sources (CONFIG_DIR=examples/bdc).
# Same placeholders as the template prompts.yaml: {context}, {chunk_content}, {text}.
# The project is named so the contextualizer does not guess what "BDC" stands for.

contextualize_chunk: |
  The document below is part of the NHLBI BioData Catalyst® (BDC) documentation. BDC always means
  BioData Catalyst, the NHLBI cloud ecosystem for heart, lung, blood and sleep research data.
  <document>
  {context}
  </document>
  Here is the chunk we want to situate within the whole document
  <chunk>
  {chunk_content}
  </chunk>

  Please give a short succinct context to situate this chunk within the overall document for the purposes of improving search retrieval of the chunk. Answer only with the succinct context and nothing else.

summarize: |-
  The text below is from the NHLBI BioData Catalyst® (BDC) documentation; BDC always means BioData Catalyst.
  Write a concise summary of the following text in 1-3 sentences, return the summary ONLY, This is NOT a conversation.

  {text}
