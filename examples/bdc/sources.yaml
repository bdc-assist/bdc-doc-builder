# NHLBI BioData Catalyst sources. doc_type values are the ones r-doc-mcp's examples/bdc/doc_types.yaml
# declares. Every original BDC source has a generic type; videos.csv is the BDC video sheet reduced to two columns.
- source_type: git
  doc_type: docs
  link: https://github.com/stagecc/bdc-gitbook   # the GitBook content repo; bdc-web's docs app syncs from it
- source_type: git
  doc_type: page
  link: https://github.com/stagecc/bdc-web#apps/site/src/pages
- source_type: git
  doc_type: update
  link: https://github.com/stagecc/bdc-web#apps/site/src/content/news
- source_type: git
  doc_type: event
  link: https://github.com/stagecc/bdc-web#apps/site/src/content/events
- source_type: git
  doc_type: fellow
  link: https://github.com/stagecc/bdc-web#apps/site/src/content/fellows
- source_type: freshdesk
  doc_type: faq
  link: https://bdcatalyst.freshdesk.com/support/solutions/60000157358   # BDC FAQs (the Fellows Program FAQ category is gone)
- source_type: transcripts
  doc_type: video
  link: videos.csv   # 2 columns: YouTube URL, SRT transcript (Drive links); a 2-column Google Sheet URL works too
